quiz:[M('Paris is ___ and full of people.','París está ___ y llena de gente.',['crowded','empty'],0),M('Tokyo is a very ___ city.','Tokio es una ciudad muy ___.',['big','small'],0),M('This street is ___. There are no people!','Esta calle está ___. ¡No hay gente!',['crowded','empty'],1),M('My neighborhood is quiet and ___.','Mi barrio es tranquilo y ___.',['dangerous','safe'],1),M('That church is very ___. It’s from the 1700s!','Esa iglesia es muy ___. ¡Es del siglo XVIII!',['old','modern'],0),M('My town is very ___. People throw trash on the street.','Mi pueblo es muy ___. La gente tira basura en la calle.',['clean','dirty'],1),M('Times Square in New York is…','Times Square en Nueva York es…',['big, busy and crowded','quiet and empty'],0),M('A small town in Europe with stone streets is…','Un pueblo europeo con calles de piedra es…',['old and quiet','modern and busy'],0),F('The opposite of “clean” is d_____.','Lo opuesto de «limpio» es d_____.',['dirty'])]},

L('WH- questions',[['What was the weather like in New York? — It was sunny!','¿Cómo estaba el clima en Nueva York? — ¡Había sol!'],['Where were they? — They were in the mountains.','¿Dónde estaban? — Estaban en las montañas.'],['When was it hot there? — It was hot in August.','¿Cuándo hacía calor allí? — En agosto.'],['How was the city? — It was so busy everywhere.','¿Cómo era la ciudad? — Estaba muy concurrida por todos lados.'],['Why was it so quiet yesterday? — Because it was a holiday.','¿Por qué estaba tan tranquilo ayer? — Porque era feriado.']]),

quiz:[M('___ the traffic bad in the city center? 🚗🚗🚗','¿___ malo el tráfico en el centro?',['Was','Were'],0),M('___ the streets in the old town crowded?','¿___ llenas de gente las calles del casco antiguo?',['Was','Were'],1),M('___ the weather sunny in Madrid?','¿___ soleado el clima en Madrid?',['Was','Were'],0),M('___ Kate cold after the walk? 🥶','¿___ frío Kate después de la caminata?',['Was','Were'],0),M('Were they in Asunción?','¿Estuvieron ellos en Asunción?',['Yes, they were.','Yes, they was.'],0),F('___ was the weather like during the festival? (What / Where)','¿___ estaba el clima durante el festival?',['what']),F('___ were the streets so empty during the snow? (Why / When)','¿___ estaban las calles tan vacías durante la nieve?',['why']),F('___ was your trip to the Alps? (How / Who)','¿___ fue tu viaje a los Alpes?',['how']),M('Why was the museum closed?','¿Por qué estaba cerrado el museo?',['Because it’s not open on Mondays.','No, but today it is.','It was sunny but very windy.'],0),F('Sara: ___ you in Madrid last week? Tom: Yes!','Sara: ¿___ en Madrid la semana pasada?',['were']),F('Sara: Was your hotel near the center? Tom: Yes, it ___. (was / were)','Tom: Sí, ___.',['was']),F('Sara: Were the stores crowded? Tom: No, they ___. (short form)','Tom: No, ___ (forma corta).',['weren’t','were not'],'weren’t = were not')]},

{ic:'🗣️',en:'Time to Talk',es:'Hora de hablar',

quiz:[M('Was it rainy in London?','¿Estuvo lluvioso en Londres?',['Yes, it was.','No, it wasn’t.'],0),M('What was the weather like in Cairo last year?','¿Cómo fue el clima en El Cairo?',['Dry and sunny most days','Cold and foggy','Rainy every day'],0),M('Was Mumbai quiet in July?','¿Estuvo tranquila Mumbai en julio?',['No, it was very crowded.','Yes, it was.'],0),M('What was the weather like in Buenos Aires in the summer?','¿Cómo fue el clima en Buenos Aires en verano?',['Very hot, with many sunny days','Rainy and cold'],0),M('Which city was rainy every day in July?','¿Qué ciudad tuvo lluvia todos los días en julio?',['Mumbai','Cairo','Buenos Aires'],0),F('In Cairo, the parks were ___ during the summer.','En El Cairo, los parques estaban ___ en verano.',['quiet'])]},

{ic:'✍️',en:'Time to Write',es:'Hora de escribir',
learn:[P('To write a question from an answer, find the key idea: weather → “What was the weather like…?”; yes/no → “Was / Were…?”','Para escribir una pregunta a partir de una respuesta, busca la idea clave: clima → «What was the weather like…?»; sí/no → «Was / Were…?»'),

{ic:'🔁',en:'Time to Review',es:'Hora de repasar',

const A=document.getElementById('app');let name='',step=0,sc={};
const steps=[];S.forEach((s,i)=>{steps.push([i,'l']);steps.push([i,'q'])});
const norm=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function start(){A.innerHTML=`<div class="card hero"><big>⛈️</big><h2>Welcome! · ¡Bienvenido!</h2><p class="en">What’s your name?</p><p class="es">¿Cómo te llamas?</p><p><input type="text" id="nm" placeholder="Your name / Tu nombre" autocomplete="off"></p><button class="nx" id="go">Start / Empezar</button></div>`;
document.getElementById('go').onclick=()=>{name=document.getElementById('nm').value.trim();if(!name){document.getElementById('nm').focus();return}step=0;show()}}
function show(){document.getElementById('pb').style.width=(step/steps.length*100)+'%';window.scrollTo(0,0);if(step>=steps.length)return end();
const[i,k]=steps[step],s=S[i];let h=`<h2>${s.ic} ${s.en}</h2><p class="es" style="margin-bottom:8px">${s.es}${k=='q'?' · Ejercicios':''}</p>`;
if(k=='l'){h+=(i==0&&step==0?`<div class="tip">Hi, ${name}! 👋 Click 🔊 to listen. The Spanish translation is below each part. / Toca 🔊 para escuchar. La traducción está debajo de cada parte.</div>`:'')+s.learn.map(r).join('')+`<button class="nx" onclick="step++;show()">Practice / Practicar</button>`}
else{sc[i]=sc[i]||{};h+=s.quiz.map((q,j)=>qh(i,q,j)).join('')+`<button class="nx" onclick="step++;show()">Next / Siguiente</button>`}
A.innerHTML=h}
function r(x){if(x.k=='p')return`<div class="b"><p class="en">${sp(x.en)}${x.en}</p><p class="es">${x.es}</p></div>`;
if(x.k=='t')return`<div class="card"><p class="en" style="font-weight:400">${sp(x.en)}${x.en}</p><p class="es">${x.es}</p></div>`;
if(x.k=='v')return`<div class="grid">${x.list.map(v=>`<button class="vc" data-t="${v[1]}"><big>${v[0]}</big><b>🔊 ${v[1]}</b><small>${v[2]}</small></button>`).join('')}</div>`;
if(x.k=='l')return`<div class="card"><b>${x.t}</b>${x.items.map(v=>`<div style="margin-top:8px"><p class="en" style="font-weight:400">${sp(v[0])}${v[0]}</p><p class="es">${v[1]}</p></div>`).join('')}</div>`;
return`<div class="card"><b>${sp(J(x.lines))} ${x.t} (play all)</b>${x.lines.map(v=>`<div style="margin-top:8px"><p class="en" style="font-weight:400">${sp(v[1])}<b>${v[0]}:</b> ${v[1]}</p><p class="es">${v[2]}</p></div>`).join('')}</div>`}
function qh(i,q,j){let h=`<div class="card q" id="q${i}_${j}"><p class="en">${j+1}. ${q.s?sp(q.s):''}${q.q}</p><p class="es">${q.es||''}</p>`;
if(q.o)h+=q.o.map((o,n)=>`<button class="o" onclick="pick(${i},${j},${n})">${o}</button>`).join('');
else h+=`<input type="text" id="i${i}_${j}" autocomplete="off"> <button class="ck" onclick="chk(${i},${j})">Check ✔</button>`;
return h+`<p class="fb"></p></div>`}
function fin(i,j,ok,ans){const q=S[i].quiz[j],e=document.getElementById(`q${i}_${j}`);if(sc[i][j]!==undefined)return;sc[i][j]=ok?1:0;
e.querySelectorAll('button.o,button.ck,input').forEach(b=>b.disabled=true);
const f=e.querySelector('.fb');f.className='fb '+(ok?'ok':'no');f.innerHTML=ok?'✅ Correct! · ¡Correcto!'+(q.x?' '+q.x:''):'❌ Answer · Respuesta: '+ans+(q.x?' — '+q.x:'');}
function pick(i,j,n){const q=S[i].quiz[j];if(sc[i][j]!==undefined)return;const bs=document.querySelectorAll(`#q${i}_${j} .o`);bs[q.a].classList.add('r');if(n!=q.a)bs[n].classList.add('w');fin(i,j,n==q.a,q.o[q.a])}
function chk(i,j){const q=S[i].quiz[j],v=document.getElementById(`i${i}_${j}`).value;if(!v.trim())return;
if(q.free){fin(i,j,v.trim().length>6,'');if(v.trim().length>6)document.querySelector(`#q${i}_${j} .fb`).innerHTML='✅ Great job writing! · ¡Buen trabajo escribiendo!';else document.querySelector(`#q${i}_${j} .fb`).innerHTML='❌ Write a full sentence · Escribe una oración completa';return}
fin(i,j,q.f.some(a=>norm(a)==norm(v)),q.f[0])}
function end(){document.getElementById('pb').style.width='100%';let tot=0,n=0,rows='';
S.forEach((s,i)=>{const a=Object.values(sc[i]||{}),ok=a.reduce((x,y)=>x+y,0),t=s.quiz.length;tot+=ok;n+=t;rows+=`<div class="sc"><span>${s.ic} ${s.en.split(':')[0]}</span><b>${ok}/${t}</b></div>`});
const p=Math.round(tot/n*100),m=p>=85?['Excellent work! You’re a weather expert! 🌟','¡Excelente trabajo! ¡Eres un experto del clima!']:p>=60?['Very good! Review the sections with fewer points. 💪','¡Muy bien! Repasa las secciones con menos puntos.']:['Keep practicing! Listen again and try the exercises once more. 🌧️➡️☀️','¡Sigue practicando! Escucha de nuevo y repite los ejercicios.'];
A.innerHTML=`<div class="card hero"><big>${p>=85?'🌈':p>=60?'🌤️':'⛅'}</big><h2>How are we doing, ${name}?</h2><p class="es">¿Qué tal vamos, ${name}?</p><h2 style="font-size:2.2rem;margin:8px 0">${p}%</h2><p class="en">${sp(m[0])}${m[0]}</p><p class="es">${m[1]}</p></div><div class="card"><b>Score by part · Puntaje por parte</b>${rows}<div class="sc"><b>Total</b><b>${tot}/${n}</b></div></div><button class="nx" onclick="sc={};step=0;show()">Try again / Intentar de nuevo</button>`}
start();
</script></body></html>
